    <div class="post-body" itemprop="articleBody"><p>记录一下shctf的hash3</p>
<span id="more"></span>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br></pre></td><td class="code"><pre><span class="line"></span><br><span class="line">import sys</span><br><span class="line"></span><br><span class="line"># 1. 读取两个文件</span><br><span class="line">try:</span><br><span class="line">    with open(&quot;collision1.bin&quot;, &quot;rb&quot;) as f:</span><br><span class="line">        data1 = f.read()</span><br><span class="line">    with open(&quot;collision2.bin&quot;, &quot;rb&quot;) as f:</span><br><span class="line">        data2 = f.read()</span><br><span class="line">except FileNotFoundError:</span><br><span class="line">    print(&quot;找不到 collision1.bin 或 collision2.bin&quot;)</span><br><span class="line">    sys.exit()</span><br><span class="line"></span><br><span class="line"># 2. 转换为题目要求的 hex 格式</span><br><span class="line">hex_str1 = data1.hex()</span><br><span class="line">hex_str2 = data2.hex()</span><br><span class="line"></span><br><span class="line"># 3. 生成最终 Payload</span><br><span class="line">payload = f&quot;&#123;hex_str1&#125;,&#123;hex_str2&#125;&quot;</span><br><span class="line"></span><br><span class="line">print(&quot;=&quot; * 60)</span><br><span class="line">print(&quot;复制下面的内容粘贴到题目输入中:&quot;)</span><br><span class="line">print(&quot;=&quot; * 60)</span><br><span class="line">print(payload)</span><br><span class="line">print(&quot;=&quot; * 60)</span><br><span class="line"></span><br><span class="line"># 4. 帮你验证一下能否通过 (模拟题目逻辑)</span><br><span class="line">import string</span><br><span class="line">table = (string.ascii_letters + string.digits).encode()</span><br><span class="line"></span><br><span class="line"># 检查 1: 长度</span><br><span class="line">if len(data1) &lt;= 16: print(&quot;[X] 长度不足&quot;)</span><br><span class="line"></span><br><span class="line"># 检查 2: 字符集 (你的文件会挂在这里)</span><br><span class="line">is_alnum1 = all(ch in table for ch in data1[:16])</span><br><span class="line">is_alnum2 = all(ch in table for ch in data2[:16])</span><br><span class="line"></span><br><span class="line">if not is_alnum1 or not is_alnum2:</span><br><span class="line">    print(&quot;\n[!!!] 警告: 文件前16字节包含不可见字符！题目要求必须是字母或数字。&quot;)</span><br><span class="line">    print(f&quot;你的文件1开头: &#123;data1[:16]&#125;&quot;)</span><br><span class="line">    print(&quot;这会导致题目输出: &#x27;No, both apples are too ordinary&#x27;&quot;)</span><br><span class="line"></span><br><span class="line"># 检查 3: 前缀是否不同</span><br><span class="line">if data1[:16] == data2[:16]:</span><br><span class="line">    print(&quot;\n[!!!] 警告: 两个文件前16字节完全相同！&quot;)</span><br><span class="line">    print(&quot;这会导致题目输出: &#x27;Oh snap, both apples are the same&#x27;&quot;)</span><br></pre></td></tr></table></figure>
